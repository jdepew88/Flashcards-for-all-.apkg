<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)" />
    <title>Flashcards — study Anki decks in your browser</title>
    <meta
      name="description"
      content="Study any compatible Anki .apkg flashcard deck directly in your browser. Decks are opened and saved locally and never uploaded to a server."
    />
    <!-- Link previews when the URL is shared. og:url, og:image and a canonical
         link need the production domain, so they are added once it is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flashcards" />
    <meta property="og:title" content="Flashcards — study Anki decks in your browser" />
    <meta
      property="og:description"
      content="Study any compatible Anki .apkg deck privately in your browser. Tap to flip, swipe to move — decks stay on your device and are never uploaded."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Applies a remembered light/dark choice before first paint. A file
         rather than inline code, because the production CSP allows scripts
         from this origin only. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
